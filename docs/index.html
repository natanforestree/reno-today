<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reno Today</title>
<meta name="description" content="Everything happening in Reno today, with things you can bring a toddler to first.">
<meta name="theme-color" content="#1d1720">
<link rel="icon" href="art/favicon.png?v=070a3430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<link rel="stylesheet" href="style.css?v=bfc1f312">
<script type="module" src="app.js?v=22514f77"></script>
</head>
<body>
<header class="sky">
  <div class="arch" role="img" aria-label="The Reno Arch: The Biggest Little City in the World"><div class="season" id="season"></div></div>
  <h1>Reno Today</h1>
  <p class="tagline" id="tagline">What's on in the Biggest Little City</p>
</header>
<main>
  <div id="notice" class="notice" aria-live="polite"></div>
  <nav class="days" id="days" aria-label="Pick a day"></nav>
  <section class="weather" id="weather" aria-label="Weather"></section>
  <div class="chips" id="chips" role="group" aria-label="Filters"></div>
  <details id="little" class="block" open></details>
  <details id="rest" class="block" open></details>
  <details id="ongoing" class="block" hidden></details>
  <details id="drive" class="block" hidden open></details>
  <details id="always" class="block" hidden></details>
  <section id="guide" class="block" hidden></section>
  <section id="more" class="block">
    <h2><span class="ico ico-calendar" aria-hidden="true"></span>More local calendars</h2>
    <div class="guide-card more-card">
      <ul class="more-list">
        <li><a href="https://www.therenoscene.com/" target="_blank" rel="noopener">The Reno Scene</a>: live music all over town, all-ages shows marked</li>
        <li><a href="https://www.nvbirds.org/event-calendar" target="_blank" rel="noopener">Northwest Nevada Bird Alliance</a>: free bird walks and field trips most weeks</li>
        <li><a href="https://www.renolittletheater.org/" target="_blank" rel="noopener">Reno Little Theater</a> and <a href="https://www.bruka.org/" target="_blank" rel="noopener">Bruka Theatre</a>: local plays and shows</li>
      </ul>
    </div>
  </section>
</main>
<footer id="footer"></footer>
</body>
</html>
